name: CI PulsePass
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987b4e138746631bb522e8299 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Qualidade, unidade, integração real, cobertura e build
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-reports
          path: |
            backend/**/target/surefire-reports
            backend/**/target/failsafe-reports
            backend/**/target/site/jacoco
          retention-days: 14
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend,frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 300
      - run: python3 scripts/smoke.py
      - name: Logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: compose-logs
          path: compose.log
          retention-days: 14
      - if: always()
        run: docker compose down
