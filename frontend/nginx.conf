server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /api/iam/ { proxy_pass http://iam:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /api/inventory/ { proxy_pass http://inventory:8080; proxy_set_header Host $host; }
    location /api/orders { proxy_pass http://orders:8080; proxy_set_header Host $host; }
    location /api/delivery/ { proxy_pass http://delivery:8080; proxy_set_header Host $host; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}
